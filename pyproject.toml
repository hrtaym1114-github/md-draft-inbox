[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-draft-inbox"
version = "0.1.0"
description = "Push Markdown drafts to a human-approval inbox only — never publish to X."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hrtaym1114" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/hrtaym1114-github/md-draft-inbox"
Related = "https://github.com/hrtaym1114-github/x-jev-gate"

[project.scripts]
md-draft-inbox = "md_draft_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
